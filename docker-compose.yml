services:
  gateway:
    build: .
    environment:
      APP_ENV: local
      GATEWAY_ADDR: :8080
      MYSQL_DSN: flashlink:flashlink@tcp(mysql:3306)/flashlink?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      REDIS_DB: 0
      REDIS_POOL_SIZE: 20
      REDIS_DIAL_TIMEOUT: 3s
      REDIS_READ_TIMEOUT: 1s
      REDIS_WRITE_TIMEOUT: 1s
      SHORT_LINK_DOMAIN: http://127.0.0.1:8080
      CLEANUP_ENABLED: "true"
      CLEANUP_INTERVAL: 24h
      CLEANUP_VISIT_RETENTION: 720h
      CLEANUP_STAT_RETENTION: 4320h
      CLEANUP_BATCH_SIZE: 1000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: flashlink
      MYSQL_DATABASE: flashlink
      MYSQL_USER: flashlink
      MYSQL_PASSWORD: flashlink
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uflashlink", "-pflashlink"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=s1=http://etcd:2380
      - --initial-cluster-token=flashlink-etcd
      - --initial-cluster-state=new
      - --logger=zap
      - --log-outputs=stderr
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  etcd_data:
